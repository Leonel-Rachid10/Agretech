<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="theme-color" content="#1F6F4A">
    <meta name="description" content="Catálogo agrícola do Distrito do Dondo — encontre produtos frescos directamente dos produtores de Mafambisse, Chinamacondo e Dondo.">
    <title>AgriTech Dondo — Catálogo Agrícola</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- NAVBAR -->
    <header class="navbar">
        <div class="logo"><span></span> AgriTech Dondo</div>
        <nav>
            <a href="/index.html">Catálogo</a>
            <a href="/dashboard.html">Gestão</a>
            <a href="/login.html" id="nav-login">Entrar</a>
        </nav>
    </header>

    <!-- BARRA DE SINCRONIZAÇÃO OFFLINE -->
    <div id="sync-bar" class="sync-bar"></div>

    <main class="container">
        <!-- TÍTULO -->
        <div class="page-intro">
            <div>
                <h1> Catálogo Agrícola do Dondo</h1>
                <p>Produtos frescos das associações de Mafambisse, Chinamacondo e Dondo Sede. Contacte directamente o produtor.</p>
            </div>
        </div>

        <!-- KPIs -->
        <div class="kpis">
            <div class="kpi-card">
                <div class="valor" id="kpi-total">—</div>
                <div class="rotulo">Lotes Disponíveis</div>
            </div>
            <div class="kpi-card">
                <div class="valor" id="kpi-volume">—</div>
                <div class="rotulo">Volume Total</div>
            </div>
            <div class="kpi-card">
                <div class="valor" id="kpi-prontos">—</div>
                <div class="rotulo">Prontos p/ Colheita</div>
            </div>
        </div>

        <!-- FILTROS (RF04) -->
        <div class="filtros">
            <h2> Filtrar Catálogo</h2>
            <div class="filtros-grid">
                <div>
                    <label>Cultura</label>
                    <select id="filtro-cultura" onchange="App.carregarCatalogo()">
                        <option value="">Todas</option>
                    </select>
                </div>
                <div>
                    <label>Localidade</label>
                    <select id="filtro-localidade" onchange="App.carregarCatalogo()">
                        <option value="">Todas</option>
                        <option value="Mafambisse">Mafambisse</option>
                        <option value="Chinamacondo">Chinamacondo</option>
                        <option value="Dondo Sede">Dondo Sede</option>
                    </select>
                </div>
                <div>
                    <label>Estado</label>
                    <select id="filtro-estado" onchange="App.carregarCatalogo()">
                        <option value="">Todos</option>
                        <option value="PRONTO_PARA_COLHEITA">Pronto p/ Colheita</option>
                        <option value="EM_CRESCIMENTO">Em Crescimento</option>
                        <option value="RESERVADO">Reservado</option>
                    </select>
                </div>
                <div>
                    <label>Qtd. Mínima (KG)</label>
                    <input type="number" id="filtro-quantidade" placeholder="Ex: 100" onchange="App.carregarCatalogo()">
                </div>
            </div>
            <div class="action-row">
                <button class="btn btn-primario" onclick="App.carregarCatalogo()"> Pesquisar</button>
                <a href="/api/relatorios/producao/pdf" target="_blank" class="btn btn-pdf"> Relatório PDF</a>
            </div>
        </div>

        <!-- LISTA DE LOTES (CATÁLOGO) -->
        <div style="position:relative;margin-bottom:16px;">
            <input type="text" id="pesquisa-catalogo" placeholder="Pesquisar por cultura, produtor ou localidade..."
                oninput="filtrarCatalogo(this.value)"
                style="width:100%;padding:11px 12px 11px 38px;border:1px solid #E0E0E0;border-radius:6px;font-size:0.95rem;color:#212121;background:#fff;transition:border-color 0.2s,box-shadow 0.2s;">
            <i style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#9E9E9E;font-size:1rem;" class="bi bi-search"></i>
        </div>
        <div id="catalogo-lista">
            <div class="empty-state"><div class="icone"></div><p>Carregando catalogo...</p></div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/db.js"></script>
    <script src="/js/sync.js"></script>
    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Registar Service Worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW erro:', err));
            }
            await App.init();
            App.preencherFiltros();
            App.carregarCatalogo();

            // Atualizar link de login/gestão
            if (Api.isLoggedIn()) {
                const navLogin = document.getElementById('nav-login');
                if (navLogin) { navLogin.textContent = Api.user.nome.split(' ')[0]; navLogin.href = '/dashboard.html'; }
            }
        });

        function filtrarCatalogo(termo) {
            const cards = document.querySelectorAll('#catalogo-lista .produto-card');
            const t = termo.toLowerCase().trim();
            cards.forEach(card => {
                card.style.display = !t || card.textContent.toLowerCase().includes(t) ? '' : 'none';
            });
        }
    </script>
</body>
</html>
