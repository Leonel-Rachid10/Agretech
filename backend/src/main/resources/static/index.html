<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="theme-color" content="#15241C">
    <meta name="description" content="Catálogo de produtos agrícolas de Moçambique.">
    <title>AgreTech Catálogo Agrícola</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" type="image/png" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/style.css">
    <script>
        (function() {
            const saved = localStorage.getItem('agritech_theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <!-- NAVBAR -->
    <header class="navbar">
        <a href="/index.html" class="logo">
            <img src="/img/logo-icon.svg" alt="AgreTech" width="28" height="28">
            <span>AgreTech</span>
        </a>
        <nav>
            <a href="/index.html">Catálogo</a>
            <a href="/dashboard.html">Gestão</a>
            <a href="/login.html" id="nav-login">Entrar</a>
            <button type="button" class="btn-theme-toggle" onclick="alternarTema()" aria-label="Alternar tema claro/escuro">
                <span id="theme-icon">🌙</span>
            </button>
        </nav>
    </header>

    <main class="container">
        <!-- TÍTULO -->
        <div class="page-intro">
            <div>
                <h1>Catálogo Agrícola</h1>
            </div>
            <a href="/api/relatorios/producao/pdf" target="_blank" class="btn btn-pdf" title="Descarregar relatório em PDF">Relatório PDF</a>
        </div>

        <!-- KPIs -->
        <div class="kpis">
            <div class="kpi-card">
                <div class="valor" id="kpi-total">0</div>
                <div class="rotulo">Produtos Disponíveis</div>
            </div>
            <div class="kpi-card">
                <div class="valor" id="kpi-quantidade">0</div>
                <div class="rotulo">Quantidade Total</div>
            </div>
            <div class="kpi-card">
                <div class="valor" id="kpi-prontos">0</div>
                <div class="rotulo">Prontos p/ Colheita</div>
            </div>
        </div>

        <!-- FILTROS (RF04) -->
        <div class="filtros">
            <h2>Filtros do catálogo</h2>
            <div class="catalog-search">
                <label for="pesquisa-catalogo">Pesquisar produtos agrícolas</label>
                <input type="search" id="pesquisa-catalogo" autocomplete="off"
                    placeholder="Nome do produto, agricultor ou localização"
                    aria-describedby="pesquisa-catalogo-ajuda"
                    oninput="filtrarCatalogo(this.value)">
                <p id="pesquisa-catalogo-ajuda" class="catalog-search-help">Pesquise por produto, agricultor, província, distrito ou zona.</p>
            </div>
            <div class="filtros-grid">
                <div>
                    <label for="filtro-cultura">Produto Agrícola</label>
                    <select id="filtro-cultura" onchange="App.carregarCatalogo()">
                        <option value="">Todos</option>
                    </select>
                </div>
                <div>
                    <label for="filtro-provincia">Província</label>
                    <select id="filtro-provincia" onchange="populateDistricts('filtro-provincia', 'filtro-localidade'); atualizarBairrosFiltro(''); App.carregarCatalogo()">
                        <option value="">Todas as Províncias</option>
                    </select>
                </div>
                <div>
                    <label for="filtro-localidade">Distrito</label>
                    <select id="filtro-localidade" disabled onchange="atualizarBairrosFiltro(this.value); App.carregarCatalogo()">
                        <option value="">Todos os Distritos</option>
                    </select>
                </div>
                <div id="col-filtro-bairro" style="display: none;">
                    <label for="filtro-bairro">Bairro / Zona</label>
                    <select id="filtro-bairro" onchange="App.carregarCatalogo()">
                        <option value="">Todos os Bairros</option>
                    </select>
                </div>
                <div>
                    <label for="filtro-estado">Estado</label>
                    <select id="filtro-estado" onchange="App.carregarCatalogo()">
                        <option value="">Todos</option>
                        <option value="PRONTO_PARA_COLHEITA">Pronto p/ Colheita</option>
                        <option value="EM_CRESCIMENTO">Em Crescimento</option>
                        <option value="RESERVADO">Reservado</option>
                    </select>
                </div>
                <div>
                    <label for="filtro-quantidade">Quantidade mínima</label>
                    <input type="number" id="filtro-quantidade" placeholder="Ex: 100" min="0" onchange="App.carregarCatalogo()">
                </div>
            </div>
            <div class="action-row">
                <button type="button" class="btn btn-primario" onclick="App.carregarCatalogo()">Aplicar filtros</button>
                <button type="button" class="btn btn-secundario" onclick="limparFiltrosCatalogo()">Limpar filtros</button>
                <a href="/api/relatorios/producao/pdf" target="_blank" class="btn btn-pdf" title="Descarregar relatório em PDF">Relatório PDF</a>
            </div>
        </div>

        <!-- LISTA DE PRODUTOS (CATÁLOGO) -->
        <p id="catalogo-resultados" class="catalogo-resultados" role="status" aria-live="polite"></p>
        <div id="catalogo-lista">
            <div class="empty-state"><div class="icone"></div><p>A carregar catálogo...</p></div>
        </div>

        <!-- PAGINAÇÃO -->
        <nav id="catalogo-paginacao" class="paginacao-container" aria-label="Paginação do catálogo"></nav>
    </main>

    <!-- RODAPÉ FIXO -->
    <footer class="agri-footer-fixed" role="contentinfo">
        <div class="footer-container">
            <span class="footer-copy">Sistema desenvolvido por <a href="https://www.instagram.com/leonel_rachid_10/" target="_blank" rel="noopener noreferrer" class="link-autor" aria-label="Abrir perfil de Leonel Rachid no Instagram">Leonel Rachid</a></span>
        </div>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/locations.js"></script>
    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            atualizarIconeTema();
            populateProvinces('filtro-provincia', 'Todas as Províncias');
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW erro:', err));
            }
            await App.init();
            App.preencherFiltros();
            await App.carregarCatalogo();

            if (Api.isLoggedIn()) {
                const navLogin = document.getElementById('nav-login');
                if (navLogin) { navLogin.textContent = Api.user.nome.split(' ')[0]; navLogin.href = '/dashboard.html'; }
            }
        });

        function alternarTema() {
            const atual = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
            const novo = atual === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', novo);
            localStorage.setItem('agritech_theme', novo);
            atualizarIconeTema();
        }

        function atualizarIconeTema() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const icon = document.getElementById('theme-icon');
            if (icon) icon.textContent = isDark ? '☀️' : '🌙';
        }

        function atualizarBairrosFiltro(distrito) {
            const col = document.getElementById('col-filtro-bairro');
            const sel = document.getElementById('filtro-bairro');
            if (!col || !sel) return;
            const bairros = window.AgriLocations?.zones?.[distrito] || [];
            if (bairros.length > 0) {
                sel.innerHTML = '<option value="">Todos os Bairros</option>' +
                    bairros.map(b => `<option value="${b}">${b}</option>`).join('');
                col.style.display = 'block';
            } else {
                sel.innerHTML = '<option value="">Todos os Bairros</option>';
                col.style.display = 'none';
            }
        }

        function limparFiltrosCatalogo() {
            const p = document.getElementById('pesquisa-catalogo');
            const c = document.getElementById('filtro-cultura');
            const prov = document.getElementById('filtro-provincia');
            const dist = document.getElementById('filtro-localidade');
            const b = document.getElementById('filtro-bairro');
            const e = document.getElementById('filtro-estado');
            const q = document.getElementById('filtro-quantidade');
            if (p) p.value = '';
            if (c) c.value = '';
            if (prov) prov.value = '';
            if (dist) { dist.innerHTML = '<option value="">Todos os Distritos</option>'; dist.disabled = true; }
            const colBairro = document.getElementById('col-filtro-bairro');
            if (colBairro) colBairro.style.display = 'none';
            if (b) b.innerHTML = '<option value="">Todos os Bairros</option>';
            if (e) e.value = '';
            if (q) q.value = '';
            App.carregarCatalogo(1);
        }

        function filtrarCatalogo(termo) {
            if (typeof App.filtrarCatalogoTexto === 'function') {
                App.filtrarCatalogoTexto(termo);
            }
        }
    </script>
</body>
</html>
