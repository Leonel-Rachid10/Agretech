<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="theme-color" content="#15241C">
    <meta name="description" content="Catálogo de produtos agrícolas de Moçambique.">
    <title>AgreTech Catálogo Agrícola</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" type="image/png" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/style.css">
    <script>
        (function() {
            const saved = localStorage.getItem('agritech_theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <!-- NAVBAR -->
    <header class="navbar">
        <a href="/index.html" class="logo">
            <img src="/img/logo-icon.svg" alt="AgreTech" width="28" height="28">
            <span>AgreTech</span>
        </a>
        <nav>
            <a href="/index.html">Catálogo</a>
            <a href="/dashboard.html">Gestão</a>
            <a href="/login.html" id="nav-login">Entrar</a>
            <button type="button" class="btn-theme-toggle" onclick="alternarTema()" aria-label="Alternar tema claro/escuro">
                <span id="theme-icon">🌙</span>
            </button>
        </nav>
    </header>

    <main class="container">
        <!-- TÍTULO -->
        <div class="page-intro">
            <div>
                <h1>Catálogo Agrícola</h1>
            </div>
        </div>

        <!-- KPIs -->
        <div class="kpis">
            <div class="kpi-card">
                <div class="valor" id="kpi-total">0</div>
                <div class="rotulo">Produtos Disponíveis</div>
            </div>
            <div class="kpi-card">
                <div class="valor" id="kpi-quantidade">0</div>
                <div class="rotulo">Quantidade Total</div>
            </div>
            <div class="kpi-card">
                <div class="valor" id="kpi-prontos">0</div>
                <div class="rotulo">Prontos p/ Colheita</div>
            </div>
        </div>

        <!-- FILTROS (RF04) -->
        <div class="filtros">
            <h2>Filtros do catálogo</h2>
            <div class="catalog-search">
                <label for="pesquisa-catalogo">Pesquisar produtos agrícolas</label>
                <input type="search" id="pesquisa-catalogo" autocomplete="off"
                    placeholder="Nome do produto, agricultor ou localização"
                    aria-describedby="pesquisa-catalogo-ajuda"
                    oninput="filtrarCatalogo(this.value)">
                <p id="pesquisa-catalogo-ajuda" class="catalog-search-help">Pesquise por produto, agricultor, província, distrito ou zona.</p>
            </div>
            <div class="filtros-grid">
                <div>
                    <label>Produto Agrícola</label>
                    <select id="filtro-cultura" onchange="App.carregarCatalogo()">
                        <option value="">Todos</option>
                    </select>
                </div>
                <div>
                    <label>Província</label>
                    <select id="filtro-provincia" onchange="populateDistricts('filtro-provincia', 'filtro-localidade'); atualizarBairrosFiltro(''); App.carregarCatalogo()">
                        <option value="">Todas as Províncias</option>
                    </select>
                </div>
                <div>
                    <label>Distrito</label>
                    <select id="filtro-localidade" disabled onchange="atualizarBairrosFiltro(this.value); App.carregarCatalogo()">
                        <option value="">Todos os Distritos</option>
                    </select>
                </div>
                <div id="col-filtro-bairro" style="display: none;">
                    <label>Bairro / Zona</label>
                    <select id="filtro-bairro" onchange="App.carregarCatalogo()">
                        <option value="">Todos os Bairros</option>
                    </select>
                </div>
                <div>
                    <label>Estado</label>
                    <select id="filtro-estado" onchange="App.carregarCatalogo()">
                        <option value="">Todos</option>
                        <option value="PRONTO_PARA_COLHEITA">Pronto p/ Colheita</option>
                        <option value="EM_CRESCIMENTO">Em Crescimento</option>
                        <option value="RESERVADO">Reservado</option>
                    </select>
                </div>
                <div>
                    <label>Quantidade mínima</label>
                    <input type="number" id="filtro-quantidade" placeholder="Ex: 100" onchange="App.carregarCatalogo()">
                </div>
            </div>
            <div class="action-row">
                <button class="btn btn-primario" onclick="App.carregarCatalogo()">Aplicar filtros</button>
                <a href="/api/relatorios/producao/pdf" target="_blank" class="btn btn-pdf"> Relatório PDF</a>
            </div>
        </div>

        <!-- LISTA DE PRODUTOS (CATÁLOGO) -->
        <p id="catalogo-resultados" class="catalogo-resultados" role="status" aria-live="polite"></p>
        <div id="catalogo-lista">
            <div class="empty-state"><div class="icone"></div><p>A carregar catálogo...</p></div>
        </div>
    </main>

    <!-- RODAPÉ FIXO -->
    <footer class="agri-footer-fixed" role="contentinfo">
        <div class="footer-container">
            <div class="footer-brand-side">
                <img src="/img/logo-icon.svg" alt="AgreTech" width="22" height="22" class="footer-logo">
                <span class="footer-brand-text">AgreTech</span>
                <span class="footer-separator">·</span>
                <span class="footer-region">Moçambique</span>
            </div>
            <div class="footer-dev-side">
                <span class="footer-dev-by">Desenvolvido por</span>
                <a href="https://www.instagram.com/leonel_rachid_10/" target="_blank" rel="noopener noreferrer" class="btn-instagram-creator" aria-label="Abrir perfil de Leonel Rachid no Instagram">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                    </svg>
                    <span class="creator-handle">@LEONEL_RACHID_10</span>
                </a>
            </div>
        </div>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/locations.js"></script>
    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            atualizarIconeTema();
            populateProvinces('filtro-provincia', 'Todas as Províncias');
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW erro:', err));
            }
            await App.init();
            App.preencherFiltros();
            await App.carregarCatalogo();

            if (Api.isLoggedIn()) {
                const navLogin = document.getElementById('nav-login');
                if (navLogin) { navLogin.textContent = Api.user.nome.split(' ')[0]; navLogin.href = '/dashboard.html'; }
            }
        });

        function alternarTema() {
            const atual = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
            const novo = atual === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', novo);
            localStorage.setItem('agritech_theme', novo);
            atualizarIconeTema();
        }

        function atualizarIconeTema() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const icon = document.getElementById('theme-icon');
            if (icon) icon.textContent = isDark ? '☀️' : '🌙';
        }

        function atualizarBairrosFiltro(distrito) {
            const col = document.getElementById('col-filtro-bairro');
            const sel = document.getElementById('filtro-bairro');
            if (!col || !sel) return;
            const zonas = AgriLocations.neighborhoods[distrito];
            if (zonas && zonas.length > 0) {
                sel.innerHTML = '<option value="">Todos os Bairros</option>' +
                                zonas.map(z => `<option value="${z}">${z}</option>`).join('');
                col.style.display = 'block';
            } else {
                sel.innerHTML = '<option value="">Todos os Bairros</option>';
                col.style.display = 'none';
            }
        }

        function normalizarPesquisa(termo) {
            return String(termo || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLocaleLowerCase('pt-MZ')
                .trim();
        }

        function filtrarCatalogo(termo) {
            const cards = document.querySelectorAll('#catalogo-lista .produto-card');
            const t = normalizarPesquisa(termo);
            let encontrados = 0;
            cards.forEach(card => {
                const corresponde = !t || normalizarPesquisa(card.textContent).includes(t);
                card.hidden = !corresponde;
                if (corresponde) encontrados += 1;
            });
            const resultado = document.getElementById('catalogo-resultados');
            if (!resultado) return;
            if (!cards.length) {
                resultado.textContent = '';
            } else if (t) {
                resultado.textContent = encontrados === 1
                    ? '1 produto encontrado.'
                    : `${encontrados} produtos encontrados.`;
            } else {
                resultado.textContent = encontrados === 1
                    ? '1 produto apresentado.'
                    : `${encontrados} produtos apresentados.`;
            }
        }
    </script>
</body>
</html>
