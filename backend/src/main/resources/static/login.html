<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="theme-color" content="#15241C">
    <title>AgreTech Entrar</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" type="image/png" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/style.css">
    <script>
        (function() {
            const saved = localStorage.getItem('agritech_theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <div class="login-container">
        <main class="login-shell">
            <section class="login-panel" aria-label="AgreTech">
                <div class="d-flex justify-content-between align-items-center w-100" style="display:flex; justify-content:space-between; align-items:center; width:100%; margin-bottom:12px;">
                    <a href="/index.html" style="color:rgba(255,255,255,0.75); text-decoration:none; font-size:0.85rem; font-weight:700;">← Catálogo</a>
                    <button type="button" class="btn-theme-toggle" onclick="alternarTema()" aria-label="Alternar tema claro/escuro" style="padding:4px 10px; border-radius:20px; font-size:0.85rem;">
                        <span id="theme-icon">🌙</span>
                    </button>
                </div>
                <div class="login-brand">
                    <img src="/img/logo-icon.svg" alt="AgreTech" width="56" height="56" style="border-radius: 12px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);">
                    <div>
                        <h1>AgreTech</h1>
                    </div>
                </div>
            </section>

            <section class="login-box" aria-label="Acesso ao sistema">
                <div class="login-box-header">
                    <span class="eyebrow">Acesso ao sistema</span>
                    <h2>Entrar na conta</h2>
                </div>

            <div id="erro-msg" class="erro-msg"></div>

            <!-- FORMULÁRIO DE LOGIN -->
            <div id="form-login-section">
                <form id="form-login" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>👤 Nome de utilizador</label>
                        <input type="text" name="nome" placeholder="Seu nome" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label>🔒 Senha</label>
                        <input type="password" name="senha" placeholder="A sua senha" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-primario btn-block btn-lg">Entrar</button>
                </form>
                <p class="auth-switch">
                    Não tem conta? <a href="#" onclick="mostrarRegisto()">Criar conta</a>
                </p>
            </div>

            <!-- FORMULÁRIO DE REGISTO -->
            <div id="form-registo-section" class="is-hidden">
                <form id="form-registo" onsubmit="handleRegisto(event)">
                    <div class="form-group">
                        <label>👤 Nome completo</label>
                        <input type="text" name="nome" placeholder="Ex: João Silva" required>
                    </div>
                    <div class="form-group">
                        <label>Telemóvel</label>
                        <input type="tel" name="telemovel" placeholder="Ex: 841234567" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label>🔒 Senha</label>
                        <input type="password" name="senha" placeholder="Mínimo 4 caracteres" autocomplete="new-password" required minlength="4">
                    </div>
                    <div class="form-group">
                        <label>👥 Tipo de conta</label>
                        <select name="perfil" required onchange="atualizarObrigatoriedadeLocalizacao()">
                            <option value="PRODUTOR">Agricultor</option>
                            <option value="COMPRADOR">Comprador</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Província</label>
                        <select name="provincia" id="registo-provincia" onchange="atualizarDistritosRegisto()">
                            <option value="">Selecione a província...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Distrito</label>
                        <select name="distrito" id="registo-distrito" disabled onchange="atualizarZonaRegisto()">
                            <option value="">Selecione a província primeiro...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Zona</label>
                        <input type="text" name="zona" id="registo-zona" list="registo-zonas" placeholder="Selecione o distrito primeiro" disabled>
                        <datalist id="registo-zonas"></datalist>
                    </div>
                    <button type="submit" class="btn btn-primario btn-block btn-lg">Criar conta</button>
                </form>
                <p class="auth-switch">
                    Já tem conta? <a href="#" onclick="mostrarLogin()">Entrar</a>
                </p>
            </div>

            <p class="auth-link">
                <a href="/index.html">Ver catálogo sem conta</a>
            </p>
            </section>
        </main>
    </div>

    <!-- RODAPÉ FIXO -->
    <footer class="agri-footer-fixed" role="contentinfo">
        <div class="footer-container">
            <span class="footer-copy">Sistema desenvolvido por <a href="https://www.instagram.com/leonel_rachid_10/" target="_blank" rel="noopener noreferrer" class="link-autor" aria-label="Abrir perfil de Leonel Rachid no Instagram">Leonel Rachid</a></span>
        </div>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/locations.js"></script>
    <script>
        // Redirecionar se já estiver logado
        if (Api.isLoggedIn()) window.location.href = '/dashboard.html';

        function alternarTema() {
            const atual = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
            const novo = atual === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', novo);
            localStorage.setItem('agritech_theme', novo);
            atualizarIconeTema();
        }

        function atualizarIconeTema() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const icon = document.getElementById('theme-icon');
            if (icon) icon.textContent = isDark ? '☀️' : '🌙';
        }

        atualizarIconeTema();

        function mostrarRegisto() {
            document.getElementById('form-login-section').classList.add('is-hidden');
            document.getElementById('form-registo-section').classList.remove('is-hidden');
            esconderErro();
        }
        function mostrarLogin() {
            document.getElementById('form-login-section').classList.remove('is-hidden');
            document.getElementById('form-registo-section').classList.add('is-hidden');
            esconderErro();
        }
        function mostrarErro(msg) {
            const el = document.getElementById('erro-msg');
            el.textContent = msg;
            el.style.display = 'block';
        }
        function esconderErro() {
            document.getElementById('erro-msg').style.display = 'none';
        }

        async function handleLogin(e) {
            e.preventDefault();
            esconderErro();
            const form = e.target;
            try {
                const res = await Api.login(form.nome.value, form.senha.value);
                Api.setAuth(res);
                window.location.href = '/dashboard.html';
            } catch (err) {
                mostrarErro('Nome ou senha incorretos. Tente novamente.');
            }
        }

        function atualizarDistritosRegisto() {
            populateDistricts('registo-provincia', 'registo-distrito', 'Selecione a província primeiro...');
            atualizarZonaRegisto();
        }

        function atualizarZonaRegisto() {
            populateZones('registo-distrito', 'registo-zona', 'registo-zonas');
        }

        function atualizarObrigatoriedadeLocalizacao() {
            const eAgricultor = document.querySelector('#form-registo [name="perfil"]').value === 'PRODUTOR';
            document.getElementById('registo-provincia').required = eAgricultor;
            document.getElementById('registo-distrito').required = eAgricultor;
            document.getElementById('registo-zona').required = eAgricultor;
        }

        async function handleRegisto(e) {
            e.preventDefault();
            esconderErro();
            const form = e.target;
            try {
                const zona = form.zona ? form.zona.value.trim() : null;
                const res = await Api.registar({
                    nome: form.nome.value,
                    telemovel: form.telemovel.value,
                    senha: form.senha.value,
                    perfil: form.perfil.value,
                    provincia: form.provincia ? form.provincia.value : null,
                    distrito: form.distrito ? form.distrito.value : null,
                    zona,
                    bairro: zona
                });
                Api.setAuth(res);
                window.location.href = '/dashboard.html';
            } catch (err) {
                mostrarErro(err.message || 'Erro ao criar conta. Verifique os dados e tente novamente.');
            }
        }

        populateProvinces('registo-provincia', 'Selecione a província...');
        atualizarObrigatoriedadeLocalizacao();
    </script>
</body>
</html>
