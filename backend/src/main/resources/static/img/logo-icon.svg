<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4332"/>
      <stop offset="50%" stop-color="#15241C"/>
      <stop offset="100%" stop-color="#0E1913"/>
    </linearGradient>

    <!-- Leaf Main Gradient -->
    <linearGradient id="leafGradMain" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D6A4F"/>
      <stop offset="50%" stop-color="#40916C"/>
      <stop offset="100%" stop-color="#52B788"/>
    </linearGradient>

    <!-- Leaf Tech Gradient -->
    <linearGradient id="leafGradTech" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74C69D"/>
      <stop offset="70%" stop-color="#52B788"/>
      <stop offset="100%" stop-color="#2D6A4F"/>
    </linearGradient>

    <!-- Gold Sun Accent -->
    <linearGradient id="goldSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2D6A4F" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base with Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="6"/>

  <g filter="url(#glow)">
    <!-- Sol / Semente Dourada no topo -->
    <circle cx="256" cy="116" r="28" fill="url(#goldSun)"/>
    <circle cx="256" cy="116" r="38" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.6"/>

    <!-- Caule / Linha de Conexão Central -->
    <path d="M 256 160 L 256 390" stroke="#74C69D" stroke-width="12" stroke-linecap="round"/>

    <!-- Folha Esquerda (Orgânica - Agricultura) -->
    <path d="M 256 340 C 180 340 110 270 125 180 C 190 180 256 240 256 340 Z" fill="url(#leafGradMain)"/>

    <!-- Nervuras Orgânicas -->
    <path d="M 215 285 C 185 270 165 240 160 215" fill="none" stroke="#B7E4C7" stroke-width="4.5" stroke-linecap="round" opacity="0.75"/>
    <path d="M 240 315 C 220 305 195 285 190 265" fill="none" stroke="#B7E4C7" stroke-width="4.5" stroke-linecap="round" opacity="0.75"/>

    <!-- Folha Direita (Tecnológica - Tech/Digital) -->
    <path d="M 256 310 C 330 310 395 245 385 160 C 320 160 256 215 256 310 Z" fill="url(#leafGradTech)"/>

    <!-- Circuitos / Nós Digitais na Folha Direita -->
    <!-- Nó 1 -->
    <path d="M 275 275 L 315 245 L 345 245" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>
    <circle cx="345" cy="245" r="7" fill="#FFFFFF"/>
    <circle cx="345" cy="245" r="11" fill="none" stroke="#74C69D" stroke-width="2.5"/>

    <!-- Nó 2 -->
    <path d="M 295 220 L 330 190 L 355 190" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>
    <circle cx="355" cy="190" r="6" fill="#FFFFFF"/>

    <!-- Base do Broto / Raiz Digital -->
    <circle cx="256" cy="390" r="12" fill="#52B788"/>
    <path d="M 230 415 Q 256 390 282 415" fill="none" stroke="#52B788" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
