# Configuracao do Servidor
server.port=8080
server.servlet.context-path=/

# Conexao com o Banco de Dados MySQL 8.0
spring.datasource.url=jdbc:mysql://localhost:3306/agritech_dondo_db?useSSL=false&serverTimezone=Africa/Maputo&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuracao JWT
jwt.secret=agritechDondoSecretKeySuperSeguraDistritoDeSofala2026MocambiqueCorredorBeiraChinamacondo
jwt.expiration=86400000

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Logging
logging.level.com.agritech.dondo=INFO
logging.level.org.springframework.security=INFO
